<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5ed7" />
    <meta name="description" content="Survey Calon Pelanggan listrik, bekerja offline." />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Survey Calon Pelanggan</title>
  </head>
  <body>
    <header class="atas">
      <div class="atas-kiri">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </div>
        <div class="atas-judul">
          <h1>Survey Calon Pelanggan</h1>
          <div class="atas-baris-sub">
            <span class="atas-sub" id="atas-sub">Listrik</span>
            <span id="badge-pending" class="badge">Memuat…</span>
          </div>
        </div>
      </div>
      <div class="atas-kanan">
        <button type="button" id="btn-nav" class="tombol-ikon tombol-nav" hidden></button>
        <button type="button" id="btn-kunci" class="tombol-ikon" hidden title="Kunci aplikasi" aria-label="Kunci aplikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </header>
    <main id="app"></main>
    <div id="notifikasi" class="notifikasi" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
